name: Promote to GitOps

on:
  workflow_run:
    workflows:
      - Lint
      - Tests
      - E2E Tests
      - Security
      - Secret Scan
      - Release Images
      - Release sklearn Runtime
    types:
      - completed

concurrency:
  group: promote-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify-promotion-gates:
    name: Verify Promotion Gates
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      platform_changed: ${{ steps.changes.outputs.platform_changed }}
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
      decision: ${{ steps.gate.outputs.decision }}

    # Only evaluate push runs for this repository's main branch.
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Capture source commit
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          test -n "$SOURCE_SHA"

          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          echo "===== SOURCE COMMIT ====="
          echo "$SOURCE_SHA"

      - name: Detect changed files
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/commits/${SOURCE_SHA}" \
            --jq '.files[].filename' \
            > /tmp/changed-files.txt

          echo "===== CHANGED FILES ====="
          cat /tmp/changed-files.txt

          PLATFORM_CHANGED=false
          RUNTIME_CHANGED=false

          while IFS= read -r file; do
            case "$file" in
              Dockerfile.sklearn-runtime|\
              .github/workflows/release-sklearn-runtime.yml)
                RUNTIME_CHANGED=true
                ;;

              go.mod|\
              go.sum|\
              Dockerfile|\
              Dockerfile.platform-api|\
              .dockerignore|\
              .github/workflows/release-images.yml)
                PLATFORM_CHANGED=true
                ;;

              *.go)
                case "$file" in
                  *_test.go)
                    ;;
                  *)
                    PLATFORM_CHANGED=true
                    ;;
                esac
                ;;
            esac
          done < /tmp/changed-files.txt

          echo "platform_changed=${PLATFORM_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "runtime_changed=${RUNTIME_CHANGED}" >> "$GITHUB_OUTPUT"

          echo
          echo "===== APPLICABILITY ====="
          echo "platform_changed=${PLATFORM_CHANGED}"
          echo "runtime_changed=${RUNTIME_CHANGED}"

      - name: Evaluate workflow results
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PLATFORM_CHANGED: ${{ steps.changes.outputs.platform_changed }}
          RUNTIME_CHANGED: ${{ steps.changes.outputs.runtime_changed }}
        run: |
          set -euo pipefail

          REQUIRED_WORKFLOWS=(
            "Lint"
            "Tests"
            "E2E Tests"
            "Security"
            "Secret Scan"
          )

          if [[ "$PLATFORM_CHANGED" == "true" ]]; then
            REQUIRED_WORKFLOWS+=(
              "Release Images"
            )
          fi

          if [[ "$RUNTIME_CHANGED" == "true" ]]; then
            REQUIRED_WORKFLOWS+=(
              "Release sklearn Runtime"
            )
          fi

          if [[ "$PLATFORM_CHANGED" != "true" && "$RUNTIME_CHANGED" != "true" ]]; then
            echo "decision=no-op" >> "$GITHUB_OUTPUT"

            echo "PROMOTION DECISION: NO-OP"
            echo
            echo "No deployable artifact domain changed."
            echo "No promotion action is required."

            exit 0
          fi

          RUNS="$(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/actions/runs?head_sha=${SOURCE_SHA}&per_page=100"
          )"

          echo "===== REQUIRED WORKFLOWS ====="
          printf '%s\n' "${REQUIRED_WORKFLOWS[@]}"

          echo
          echo "===== RESULTS ====="

          WAITING=false
          BLOCKED=false

          for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
            RESULT="$(
              jq -r \
                --arg workflow "$workflow" \
                '
                [
                  .workflow_runs[]
                  | select(
                      .name == $workflow
                      and .event == "push"
                      and .head_branch == "main"
                    )
                ]
                | sort_by(.created_at)
                | reverse
                | .[0]
                | if . == null then
                    "missing"
                  else
                    "\(.status):\(.conclusion // "none")"
                  end
                ' \
                <<< "$RUNS"
            )"

            printf '%-32s %s\n' "${workflow}:" "$RESULT"

            case "$RESULT" in
              completed:success)
                ;;

              completed:failure|\
              completed:cancelled|\
              completed:timed_out|\
              completed:action_required|\
              completed:startup_failure)
                BLOCKED=true
                ;;

              *)
                WAITING=true
                ;;
            esac
          done

          echo

          if [[ "$BLOCKED" == "true" ]]; then
            echo "decision=blocked" >> "$GITHUB_OUTPUT"

            echo "PROMOTION DECISION: BLOCKED"
            echo
            echo "At least one required workflow completed unsuccessfully."

            exit 1
          fi

          if [[ "$WAITING" == "true" ]]; then
            echo "decision=waiting" >> "$GITHUB_OUTPUT"

            echo "PROMOTION DECISION: WAITING"
            echo
            echo "One or more required workflows are missing or have not completed."
            echo "No promotion action will occur."

            exit 0
          fi

          echo "decision=ready" >> "$GITHUB_OUTPUT"

          echo "PROMOTION DECISION: READY"
          echo
          echo "PASS: every workflow required for this source commit succeeded."

      - name: Promotion gate passed
        if: steps.gate.outputs.decision == 'ready'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          echo "===== PROMOTION CHECKPOINT ====="
          echo
          echo "Source SHA:"
          echo "$SOURCE_SHA"
          echo
          echo "All applicable gates passed."

  resolve-platform-digests:
    name: Resolve Platform Image Digests
    runs-on: ubuntu-latest

    needs:
      - verify-promotion-gates

    if: >
      needs.verify-promotion-gates.outputs.decision == 'ready' &&
      needs.verify-promotion-gates.outputs.platform_changed == 'true'

    permissions:
      contents: read
      packages: read

    outputs:
      operator_digest: ${{ steps.digests.outputs.operator }}
      api_digest: ${{ steps.digests.outputs.api }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released image digests
        id: digests
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify-promotion-gates.outputs.source_sha }}
        run: |
          set -euo pipefail

          OPERATOR_IMAGE="ghcr.io/anselem-okeke/ai-platform-operator:sha-${SOURCE_SHA}"
          API_IMAGE="ghcr.io/anselem-okeke/ai-platform-api:sha-${SOURCE_SHA}"

          echo "===== RELEASED IMAGE TAGS ====="
          echo "operator=${OPERATOR_IMAGE}"
          echo "api=${API_IMAGE}"

          OPERATOR_DIGEST="$(
            docker buildx imagetools inspect \
              "$OPERATOR_IMAGE" \
              --format '{{json .Manifest.Digest}}' \
            | tr -d '"'
          )"

          API_DIGEST="$(
            docker buildx imagetools inspect \
              "$API_IMAGE" \
              --format '{{json .Manifest.Digest}}' \
            | tr -d '"'
          )"

          test -n "$OPERATOR_DIGEST"
          test -n "$API_DIGEST"

          if [[ ! "$OPERATOR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid operator digest: ${OPERATOR_DIGEST}" >&2
            exit 1
          fi

          if [[ ! "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid API digest: ${API_DIGEST}" >&2
            exit 1
          fi

          echo "operator=${OPERATOR_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "api=${API_DIGEST}" >> "$GITHUB_OUTPUT"

          echo
          echo "===== IMMUTABLE DIGESTS ====="
          echo "operator=${OPERATOR_DIGEST}"
          echo "api=${API_DIGEST}"

  update-gitops:
    name: Create GitOps Update PR
    runs-on: ubuntu-latest

    needs:
      - verify-promotion-gates
      - resolve-platform-digests

    if: >
      needs.verify-promotion-gates.outputs.decision == 'ready' &&
      needs.verify-promotion-gates.outputs.platform_changed == 'true' &&
      needs.resolve-platform-digests.result == 'success'

    permissions:
      contents: read

    steps:
      - name: Verify promotion inputs
        env:
          SOURCE_SHA: ${{ needs.verify-promotion-gates.outputs.source_sha }}
          OPERATOR_DIGEST: ${{ needs.resolve-platform-digests.outputs.operator_digest }}
          API_DIGEST: ${{ needs.resolve-platform-digests.outputs.api_digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: ${SOURCE_SHA}" >&2
            exit 1
          fi

          if [[ ! "$OPERATOR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid operator digest: ${OPERATOR_DIGEST}" >&2
            exit 1
          fi

          if [[ ! "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid API digest: ${API_DIGEST}" >&2
            exit 1
          fi

          echo "PASS: promotion inputs are valid"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: anselem-okeke
          repositories: |
            ai-platform-gitops
          permission-contents: write
          permission-pull-requests: write

      - name: Clone GitOps repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: anselem-okeke/ai-platform-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: ai-platform-gitops
          ref: main
          persist-credentials: false

      - name: Update image digests
        working-directory: ai-platform-gitops
        env:
          OPERATOR_DIGEST: ${{ needs.resolve-platform-digests.outputs.operator_digest }}
          API_DIGEST: ${{ needs.resolve-platform-digests.outputs.api_digest }}
        shell: bash
        run: |
          set -euo pipefail

          OPERATOR_FILE="platform/operator/overlays/dev/kustomization.yaml"
          API_FILE="platform/api/overlays/dev/kustomization.yaml"

          echo "=== INPUT DIGESTS ==="
          echo "operator=${OPERATOR_DIGEST}"
          echo "api=${API_DIGEST}"

          grep -q \
            'newName: ghcr.io/anselem-okeke/ai-platform-operator' \
            "$OPERATOR_FILE"

          grep -q \
            '^[[:space:]]*digest: sha256:' \
            "$OPERATOR_FILE"

          grep -q \
            'newName: ghcr.io/anselem-okeke/ai-platform-api' \
            "$API_FILE"

          grep -q \
            '^[[:space:]]*digest: sha256:' \
            "$API_FILE"

          sed -i \
            "s|^[[:space:]]*digest: sha256:.*|    digest: ${OPERATOR_DIGEST}|" \
            "$OPERATOR_FILE"

          sed -i \
            "s|^[[:space:]]*digest: sha256:.*|    digest: ${API_DIGEST}|" \
            "$API_FILE"

      - name: Validate GitOps manifests
        working-directory: ai-platform-gitops
        shell: bash
        run: |
          set -euo pipefail

          kubectl kustomize \
            platform/operator/overlays/dev \
            >/tmp/operator.yaml

          kubectl kustomize \
            platform/api/overlays/dev \
            >/tmp/api.yaml

      - name: Verify expected digests rendered
        working-directory: ai-platform-gitops
        env:
          OPERATOR_DIGEST: ${{ needs.resolve-platform-digests.outputs.operator_digest }}
          API_DIGEST: ${{ needs.resolve-platform-digests.outputs.api_digest }}
        shell: bash
        run: |
          set -euo pipefail

          grep -F \
            "ghcr.io/anselem-okeke/ai-platform-operator@${OPERATOR_DIGEST}" \
            /tmp/operator.yaml

          grep -F \
            "ghcr.io/anselem-okeke/ai-platform-api@${API_DIGEST}" \
            /tmp/api.yaml

          echo "PASS: expected immutable digests rendered"

      - name: Check for GitOps changes
        id: changes
        working-directory: ai-platform-gitops
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GitOps already references these digests."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GitOps image update required."
          fi

      - name: Resolve GitHub App bot identity
        if: steps.changes.outputs.changed == 'true'
        id: bot
        working-directory: ai-platform-gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail

          BOT_ID="$(
            gh api \
              "/users/${APP_SLUG}[bot]" \
              --jq '.id'
          )"

          echo "id=${BOT_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure Git identity
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          BOT_ID: ${{ steps.bot.outputs.id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create GitOps branch and commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          SOURCE_SHA: ${{ needs.verify-promotion-gates.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/image-${SOURCE_SHA}"

          git checkout -b "$BRANCH"

          git add \
            platform/operator/overlays/dev/kustomization.yaml \
            platform/api/overlays/dev/kustomization.yaml

          git diff --cached --check

          echo "=== STAGED CHANGE ==="
          git diff --cached

          git commit \
            -m "chore(dev): deploy images from ${SOURCE_SHA}"

          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Push GitOps branch
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote set-url \
            origin \
            "https://x-access-token:${GH_TOKEN}@github.com/anselem-okeke/ai-platform-gitops.git"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      - name: Create GitOps pull request
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ needs.verify-promotion-gates.outputs.source_sha }}
          OPERATOR_DIGEST: ${{ needs.resolve-platform-digests.outputs.operator_digest }}
          API_DIGEST: ${{ needs.resolve-platform-digests.outputs.api_digest }}
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/gitops-pr-body.md <<EOF
          Automated deployment update from:

          \`anselem-okeke/ai-platform-operator@${SOURCE_SHA}\`

          ## Immutable images

          - Operator:
            \`ghcr.io/anselem-okeke/ai-platform-operator@${OPERATOR_DIGEST}\`

          - API:
            \`ghcr.io/anselem-okeke/ai-platform-api@${API_DIGEST}\`

          ## Promotion gates

          - Lint
          - Tests
          - E2E Tests
          - Security
          - Secret Scan
          - Release Images
          - Container vulnerability gates
          - SPDX SBOM generation
          - Provenance attestation
          - SBOM attestation
          - Kustomize rendering validation

          Promotion is created only after the centralized promotion gate reaches READY.

          After approval and merge, Argo CD will reconcile these immutable digests into the dev cluster.
          EOF

          gh pr create \
            --repo anselem-okeke/ai-platform-gitops \
            --base main \
            --head "$BRANCH" \
            --title "chore(dev): deploy images from ${SOURCE_SHA}" \
            --body-file /tmp/gitops-pr-body.md
