name: Release Breast cancer model artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile.breast-cancer-model-artifact
      - models/breast-cancer/**
      - scripts/model-artifacts/validate-breast-cancer-model-artifact-image.sh
      - .github/workflows/release-breast-cancer-model-artifact.yml

  push:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile.breast-cancer-model-artifact
      - models/breast-cancer/**
      - scripts/model-artifacts/validate-breast-cancer-model-artifact-image.sh
      - .github/workflows/release-breast-cancer-model-artifact.yml

  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-platform-breast-cancer-model-artifact
  MODEL_VERSION: v1

jobs:
  build-breast-cancer-model-artifact:
    name: Build Breast cancer model artifact
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${MODEL_VERSION}-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Breast cancer model artifact for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.breast-cancer-model-artifact
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          build-args: |
            MODEL_VERSION=${{ env.MODEL_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Breast cancer model artifact
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.local }}
          EXPECTED_MODEL_VERSION: ${{ env.MODEL_VERSION }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          scripts/model-artifacts/validate-breast-cancer-model-artifact-image.sh \
            "$IMAGE" \
            "$EXPECTED_MODEL_VERSION" \
            "$EXPECTED_SOURCE_REVISION"

      - name: Scan Breast cancer model artifact image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate Breast cancer model artifact SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.local }}
          format: spdx-json
          output-file: breast-cancer-model-artifact-sbom.spdx.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Breast cancer model artifact
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.breast-cancer-model-artifact
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            MODEL_VERSION=${{ env.MODEL_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Generate Breast cancer model artifact provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest Breast cancer model artifact SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: breast-cancer-model-artifact-sbom.spdx.json
          push-to-registry: true

      - name: Print immutable Breast cancer model artifact reference
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          echo
          echo "===== IMMUTABLE BREAST CANCER MODEL ARTIFACT ====="
          echo "${IMAGE}@${DIGEST}"
