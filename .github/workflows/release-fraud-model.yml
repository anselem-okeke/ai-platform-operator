name: Release fraud model

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.fraud-model
      - .github/workflows/release-fraud-model.yml

  push:
    branches:
      - main
    paths:
      - Dockerfile.fraud-model
      - .github/workflows/release-fraud-model.yml

  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-platform-fraud-model

jobs:
  build-fraud-model:
    name: Build fraud model
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build fraud model for security validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.fraud-model
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test fraud model
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.local }}
        run: |
          set -euo pipefail

          ARCH="$(
            docker image inspect "$IMAGE" \
              --format '{{.Architecture}}'
          )"

          USER_ID="$(
            docker image inspect "$IMAGE" \
              --format '{{.Config.User}}'
          )"

          PORTS="$(
            docker image inspect "$IMAGE" \
              --format '{{json .Config.ExposedPorts}}'
          )"

          echo "architecture=${ARCH}"
          echo "user=${USER_ID}"
          echo "ports=${PORTS}"

          test "$ARCH" = "amd64"
          test "$USER_ID" = "101"
          grep -F '"8080/tcp"' <<< "$PORTS"

          docker run --rm "$IMAGE" nginx -t

          echo "Fraud model smoke test passed."

      - name: Scan fraud model image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate fraud model SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.local }}
          format: spdx-json
          output-file: fraud-model-sbom.spdx.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fraud model
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.fraud-model
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Generate fraud model provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest fraud model SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: fraud-model-sbom.spdx.json
          push-to-registry: true

      - name: Print immutable fraud model reference
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          echo
          echo "===== IMMUTABLE FRAUD MODEL ====="
          echo "${IMAGE}@${DIGEST}"
