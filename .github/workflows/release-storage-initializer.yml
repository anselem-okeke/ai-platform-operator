name: Release storage initializer

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.storage-initializer
      - .github/workflows/release-storage-initializer.yml

  push:
    branches:
      - main
    paths:
      - Dockerfile.storage-initializer
      - .github/workflows/release-storage-initializer.yml

  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai-platform-storage-initializer

jobs:
  build-storage-initializer:
    name: Build storage initializer
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build storage initializer for security validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.storage-initializer
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test storage initializer
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.local }}
        run: |
          set -euo pipefail

          echo "===== IMAGE CONFIGURATION ====="

          USER="$(
            docker image inspect               "$IMAGE"               --format '{{.Config.User}}'
          )"

          ENTRYPOINT="$(
            docker image inspect               "$IMAGE"               --format '{{join .Config.Entrypoint " "}}'
          )"

          ARCH="$(
            docker image inspect               "$IMAGE"               --format '{{.Architecture}}'
          )"

          echo "architecture=${ARCH}"
          echo "user=${USER}"
          echo "entrypoint=${ENTRYPOINT}"

          test "$ARCH" = "amd64"
          test "$USER" = "1000"
          test "$ENTRYPOINT" = "/storage-initializer/scripts/initializer-entrypoint"

          echo
          echo "===== ENTRYPOINT USAGE PROBE ====="

          set +e

          docker run --rm             "$IMAGE"             --help             >/tmp/storage-initializer-usage.txt             2>&1

          STATUS=$?

          set -e

          cat /tmp/storage-initializer-usage.txt

          grep -F             "Usage: initializer-entrypoint src_uri_0 dest_path_0"             /tmp/storage-initializer-usage.txt

          if [[ "$STATUS" -eq 0 ]]; then
            echo "ERROR: usage probe unexpectedly returned success" >&2
            exit 1
          fi

          echo
          echo "PASS: storage initializer image configuration is correct"
          echo "PASS: storage initializer entrypoint executed and returned expected usage behavior"

      - name: Scan storage initializer image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate storage initializer SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.local }}
          format: spdx-json
          output-file: storage-initializer-sbom.spdx.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push storage initializer
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.storage-initializer
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Generate storage initializer provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest storage initializer SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: storage-initializer-sbom.spdx.json
          push-to-registry: true

      - name: Print immutable storage initializer reference
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          echo
          echo "===== IMMUTABLE STORAGE INITIALIZER ====="
          echo "${IMAGE}@${DIGEST}"
