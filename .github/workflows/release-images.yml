name: Release Images

on:
  push:
    branches:
      - main

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-operator:
    name: Build Operator Image
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/ai-platform-operator" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=ai-platform-operator:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build operator image for security validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan operator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate operator SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.local }}
          format: spdx-json
          output-file: operator-sbom.spdx.json

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Generate operator provenance
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest operator SBOM
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: operator-sbom.spdx.json
          push-to-registry: true

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/ai-platform-api" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "local=ai-platform-api:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build API image for security validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.platform-api
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.meta.outputs.local }}
          format: spdx-json
          output-file: api-sbom.spdx.json

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile.platform-api
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Generate API provenance
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest API SBOM
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: api-sbom.spdx.json
          push-to-registry: true

  update-gitops:
    name: Create GitOps Update PR

    needs:
      - build-operator
      - build-api

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: anselem-okeke
          repositories: |
            ai-platform-gitops
          permission-contents: write
          permission-pull-requests: write

      - name: Clone GitOps repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: anselem-okeke/ai-platform-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: ai-platform-gitops
          ref: main
          persist-credentials: false

      - name: Update image digests
        working-directory: ai-platform-gitops
        env:
          OPERATOR_DIGEST: ${{ needs.build-operator.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          OPERATOR_FILE="platform/operator/overlays/dev/kustomization.yaml"
          API_FILE="platform/api/overlays/dev/kustomization.yaml"

          echo "=== INPUT DIGESTS ==="
          echo "operator=${OPERATOR_DIGEST}"
          echo "api=${API_DIGEST}"

          grep -q \
            'newName: ghcr.io/anselem-okeke/ai-platform-operator' \
            "$OPERATOR_FILE"

          grep -q \
            '^[[:space:]]*digest: sha256:' \
            "$OPERATOR_FILE"

          grep -q \
            'newName: ghcr.io/anselem-okeke/ai-platform-api' \
            "$API_FILE"

          grep -q \
            '^[[:space:]]*digest: sha256:' \
            "$API_FILE"

          sed -i \
            "s|^[[:space:]]*digest: sha256:.*|    digest: ${OPERATOR_DIGEST}|" \
            "$OPERATOR_FILE"

          sed -i \
            "s|^[[:space:]]*digest: sha256:.*|    digest: ${API_DIGEST}|" \
            "$API_FILE"

          echo
          echo "=== OPERATOR OVERLAY ==="
          cat "$OPERATOR_FILE"

          echo
          echo "=== API OVERLAY ==="
          cat "$API_FILE"

      - name: Validate GitOps manifests
        working-directory: ai-platform-gitops
        shell: bash
        run: |
          set -euo pipefail

          kubectl kustomize \
            platform/operator/overlays/dev \
            >/tmp/operator.yaml

          kubectl kustomize \
            platform/api/overlays/dev \
            >/tmp/api.yaml

          echo "=== RENDERED OPERATOR IMAGE ==="
          grep 'image:' /tmp/operator.yaml

          echo
          echo "=== RENDERED API IMAGE ==="
          grep 'image:' /tmp/api.yaml

      - name: Verify expected digests rendered
        working-directory: ai-platform-gitops
        env:
          OPERATOR_DIGEST: ${{ needs.build-operator.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          grep -F \
            "ghcr.io/anselem-okeke/ai-platform-operator@${OPERATOR_DIGEST}" \
            /tmp/operator.yaml

          grep -F \
            "ghcr.io/anselem-okeke/ai-platform-api@${API_DIGEST}" \
            /tmp/api.yaml

          echo "PASS: expected immutable digests rendered"

      - name: Check for GitOps changes
        id: changes
        working-directory: ai-platform-gitops
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GitOps already references these digests."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GitOps image update required."
          fi

      - name: Resolve GitHub App bot identity
        if: steps.changes.outputs.changed == 'true'
        id: bot
        working-directory: ai-platform-gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail

          BOT_ID="$(
            gh api \
              "/users/${APP_SLUG}[bot]" \
              --jq '.id'
          )"

          echo "id=${BOT_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure Git identity
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          BOT_ID: ${{ steps.bot.outputs.id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "${APP_SLUG}[bot]"

          git config \
            user.email \
            "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create GitOps branch and commit
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/image-${SOURCE_SHA}"

          git checkout -b "$BRANCH"

          git add \
            platform/operator/overlays/dev/kustomization.yaml \
            platform/api/overlays/dev/kustomization.yaml

          git diff --cached --check

          echo "=== STAGED CHANGE ==="
          git diff --cached

          git commit \
            -m "chore(dev): deploy images from ${SOURCE_SHA}"

          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Push GitOps branch
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote set-url \
            origin \
            "https://x-access-token:${GH_TOKEN}@github.com/anselem-okeke/ai-platform-gitops.git"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      - name: Create GitOps pull request
        if: steps.changes.outputs.changed == 'true'
        working-directory: ai-platform-gitops
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
          OPERATOR_DIGEST: ${{ needs.build-operator.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          cat >/tmp/gitops-pr-body.md <<EOF
          Automated deployment update from:

          \`anselem-okeke/ai-platform-operator@${SOURCE_SHA}\`

          ## Immutable images

          - Operator:
            \`ghcr.io/anselem-okeke/ai-platform-operator@${OPERATOR_DIGEST}\`

          - API:
            \`ghcr.io/anselem-okeke/ai-platform-api@${API_DIGEST}\`

          ## Supply-chain gates

          - Go lint
          - Unit / envtest
          - govulncheck
          - Container build
          - Trivy HIGH/CRITICAL vulnerability gate
          - SPDX SBOM generation
          - Provenance attestation
          - SBOM attestation
          - Kustomize rendering validation

          After approval and merge, Argo CD will reconcile these immutable digests into the dev cluster.
          EOF

          gh pr create \
            --repo anselem-okeke/ai-platform-gitops \
            --base main \
            --head "$BRANCH" \
            --title "chore(dev): deploy images from ${SOURCE_SHA}" \
            --body-file /tmp/gitops-pr-body.md