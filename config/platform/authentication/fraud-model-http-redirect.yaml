apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fraud-model-http-redirect
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: fraud-model-http-redirect
    app.kubernetes.io/component: edge-routing
    app.kubernetes.io/part-of: ai-platform
spec:
  hostnames:
    - fraud-model.local

  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
      sectionName: http

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
