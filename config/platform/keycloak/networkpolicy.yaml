apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak

  policyTypes:
    - Ingress

  ingress:
    # Public Keycloak HTTP traffic may come only from the
    # Envoy data plane belonging to shared-gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system

          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: shared-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: gateway-system

      ports:
        - protocol: TCP
          port: 8080

    # Internal health and metrics access for explicitly labelled
    # operational Pods in the Keycloak namespace.
    - from:
        - podSelector:
            matchLabels:
              keycloak-management-client: "true"

      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-postgres-ingress
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak

      ports:
        - protocol: TCP
          port: 5432
